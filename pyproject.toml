[project]
name = "simple-survey"
version = "0.1.0"
description = "A lightweight Flask survey application using SurveyJS"
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
	"flask>=3.0",
	"flask-smorest>=0.45",
	"flask-sqlalchemy>=3.1",
	"marshmallow>=3.20",
	"python-dotenv>=1.0",
]

[project.scripts]
survey-preview = "simple_survey.cli:main"

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9"]
mssql = ["pymssql>=2.2"]
prod = ["gunicorn>=22.0"]

[dependency-groups]
dev = [
	"gunicorn>=22.0",
	"psycopg2-binary>=2.9",
	"pymssql>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
